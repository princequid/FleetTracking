server:
  port: 8085

spring:
  application:
    name: gps-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gps
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: gps
    default-schema: gps
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: fleettrack
    password: fleettrack

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:fleettrack-internal-dev-secret}

app:
  cors:
    # Origins allowed to open the /ws STOMP endpoint. Mirrors api-gateway_1's CorsConfig
    # (admin-portal_4 Vite dev server on 5173, plus the 3000 fallback already allowed
    # there). Override with a comma-separated list via APP_CORS_ALLOWED_ORIGINS once a
    # deployed origin exists.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    com.fleettrack.gps: DEBUG
    org.hibernate.SQL: WARN
