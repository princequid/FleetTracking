server:
  shutdown: graceful
  port: 8085

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: gps-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gps
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: gps
    default-schema: gps
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      # Redis now requires auth (see infrastructure_1/docker-compose.yml). Blank
      # default so a local redis-server without a password still works in dev;
      # compose injects SPRING_DATA_REDIS_PASSWORD in every deployed environment.
      password: ${SPRING_DATA_REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

logging:
  level:
    com.fleettrack.gps: DEBUG
    org.hibernate.SQL: WARN
