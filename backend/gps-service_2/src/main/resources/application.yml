server:
  port: 8085

spring:
  application:
    name: gps-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gps
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: gps
    default-schema: gps
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.fleettrack.gps: DEBUG
    org.hibernate.SQL: WARN
