server:
  shutdown: graceful
  port: 8081

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: auth-service

  # ─────────────────────────────────────────────────────────────
  # Local PostgreSQL (Docker Compose) — matches infrastructure_1/docker-compose.yml
  # POSTGRES_USER=fleettrack, POSTGRES_PASSWORD=fleettrack, POSTGRES_DB=fleettrack
  # ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns schema changes — Hibernate must not auto-create/alter tables
    properties:
      hibernate:
        default_schema: fleettrack_auth
        format_sql: true
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    schemas: fleettrack_auth
    default-schema: fleettrack_auth
    baseline-on-migrate: true

  # Gmail SMTP — GMAIL_USERNAME/GMAIL_APP_PASSWORD are set as environment variables,
  # never committed here. The app password comes from a Google Account with 2-Step
  # Verification enabled (myaccount.google.com/apppasswords), not a Cloud API key.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

fleetsync:
  email:
    # Gmail requires the From address to be the authenticated account itself (or a
    # verified alias) — unlike Resend, you can't send "as" an arbitrary address.
    from-address: ${GMAIL_USERNAME:}
    from-name: FleetSync
  # Base URL of the web app that hosts /reset-password — used by the forgot-password
  # email. The admin portal is the only web frontend in this project today.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Deep-link scheme registered in mobile/app.json ("scheme": "fleettrack") — used only
  # by PasswordResetService's forgot-password link for DRIVER accounts, which opens
  # straight into the app's reset-password screen instead of the web admin portal, since
  # drivers only ever use the mobile app.
  mobile-app-scheme: ${MOBILE_APP_SCHEME:fleettrack}

app:
  # Creates the first SUPER_ADMIN account on boot if none exists yet — see
  # InitialAdminBootstrap. Leave both unset (the default) to disable entirely, e.g. in
  # local dev where you create test users by hand.
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}

# JWT configuration
jwt:
  secret: ${JWT_SECRET}
  # Short-lived access tokens (both clients silently refresh on 401 with rotation,
  # so this is invisible to users but shrinks the window for a stolen access token).
  access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
  refresh-token-expiry-days: 7
  issuer: ${JWT_ISSUER:fleettrack-auth}
  audience: ${JWT_AUDIENCE:fleettrack-clients}

logging:
  level:
    com.fleettrack.auth: DEBUG
    org.hibernate.SQL: WARN
