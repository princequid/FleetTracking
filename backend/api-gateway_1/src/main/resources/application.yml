server:
  shutdown: graceful
  port: 8080

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # routes defined in RouteConfig.java

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

# Shared secret the gateway stamps on every downstream request; services require it.
internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.fleettrack.gateway: DEBUG
