server:
  shutdown: graceful
  port: 8090

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: audit
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: audit
    default-schema: audit
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.fleettrack.audit: DEBUG
    org.hibernate.SQL: WARN
