server:
  shutdown: graceful
  port: 8083
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: vehicle-service
  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: vehicle
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    schemas: vehicle
    default-schema: vehicle
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

logging:
  level:
    com.fleettrack.vehicle: DEBUG
    org.hibernate.SQL: WARN
