server:
  port: 8083
spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: vehicle
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    schemas: vehicle
    default-schema: vehicle
    baseline-on-migrate: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:fleettrack-internal-dev-secret}

logging:
  level:
    com.fleettrack.vehicle: DEBUG
    org.hibernate.SQL: WARN
