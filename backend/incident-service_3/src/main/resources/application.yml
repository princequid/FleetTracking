server:
  shutdown: graceful
  port: 8087

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: incident
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: incident
    default-schema: incident
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
