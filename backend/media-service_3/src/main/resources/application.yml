server:
  port: 8086

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: media
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: media
    default-schema: media
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:fleettrack-internal-dev-secret}

logging:
  level:
    com.fleettrack.media: DEBUG
    org.hibernate.SQL: WARN

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # The endpoint baked into presigned upload URLs — opened by the phone, so it must be
  # the dev machine's LAN IP (same host the app uses for the API), not localhost.
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://172.20.10.4:9000}
  accessKey: fleettrack
  secretKey: fleettrack123
  bucket: fleettrack-media
