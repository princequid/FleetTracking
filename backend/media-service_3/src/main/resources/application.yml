server:
  shutdown: graceful
  port: 8086

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: media
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: media
    default-schema: media
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

logging:
  level:
    com.fleettrack.media: DEBUG
    org.hibernate.SQL: WARN

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # The endpoint baked into presigned upload URLs — opened by the phone, so it must be
  # the dev machine's LAN IP (same host the app uses for the API), not localhost.
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://172.20.10.4:9000}
  # Env-overridable (docker-compose passes MINIO_ACCESS_KEY / MINIO_SECRET_KEY). The
  # defaults match local dev; a real deployment MUST set these to the actual MinIO creds
  # — otherwise media would keep using the dev password even after MinIO's is changed.
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:fleettrack-media}
