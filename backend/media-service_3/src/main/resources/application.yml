server:
  port: 8086

spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: media
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: media
    default-schema: media
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.fleettrack.media: DEBUG
    org.hibernate.SQL: WARN

minio:
  endpoint: http://localhost:9000
  external-endpoint: http://localhost:9000
  accessKey: fleettrack
  secretKey: fleettrack123
  bucket: fleettrack-media
