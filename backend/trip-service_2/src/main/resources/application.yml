server:
  port: 8084

spring:
  application:
    name: trip-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: fleettrack
    password: fleettrack
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trip
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: trip
    default-schema: trip
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: fleettrack
    password: fleettrack

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:fleettrack-internal-dev-secret}

osrm:
  # localhost:5000 only works running this service directly on the host (e.g. from an
  # IDE) alongside a locally-running OSRM. In Docker Compose, OSRM is a separate
  # container — docker-compose.yml sets OSRM_BASE_URL=http://osrm:5000 so containers
  # resolve it by service name instead.
  base-url: ${OSRM_BASE_URL:http://localhost:5000}

logging:
  level:
    com.fleettrack.trip: DEBUG
    org.hibernate.SQL: WARN
