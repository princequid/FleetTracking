server:
  shutdown: graceful
  port: 8088

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fleettrack
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notif
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    schemas: notif
    default-schema: notif
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # Gmail SMTP — GMAIL_USERNAME/GMAIL_APP_PASSWORD are set as environment variables,
  # never committed here. Same Google account as auth-service.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

fleetsync:
  email:
    from-address: ${GMAIL_USERNAME:}
    from-name: FleetSync
  # Admin portal base URL — used for "View incident" / "View full dashboard" links.
  admin-portal-url: ${ADMIN_PORTAL_URL:http://localhost:5173}

logging:
  level:
    com.fleettrack.notification: DEBUG
    org.hibernate.SQL: WARN
