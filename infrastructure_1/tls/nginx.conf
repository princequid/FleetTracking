worker_processes auto;
events { worker_connections 1024; }

http {
    # Maps the Upgrade header so WebSocket (/ws) connections proxy correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect every plain-HTTP request to HTTPS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # TLS termination — forwards to the API gateway over the internal network.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fleettrack.crt;
        ssl_certificate_key /etc/nginx/certs/fleettrack.key;

        # TLS 1.2+ only, strong ciphers.
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25m; # allow POD/photo uploads

        location / {
            proxy_pass         http://api-gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            # WebSocket upgrade for /ws
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
