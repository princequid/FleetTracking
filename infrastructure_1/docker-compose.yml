# ===========================================================================
# FleetTrack Pro — Docker Compose
# ===========================================================================
# Start order:
#   1. Infrastructure  — postgres, rabbitmq, redis, minio, osrm
#   2. Eureka Server   — service registry (waits for postgres healthcheck)
#   3. Auth Service    — JWT auth (waits for postgres + eureka)
#   4. API Gateway     — single entry point (waits for eureka + auth)
#   5. Business services — driver, vehicle, trip, etc. (wait for postgres + eureka)
#
# Run:  docker compose up -d
# Logs: docker compose logs -f
# Stop: docker compose down
# ===========================================================================

services:

  # ── Infrastructure ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleettrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      POSTGRES_DB: ${POSTGRES_DB:-fleettrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${HOST_BIND:-0.0.0.0}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fleettrack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fleettrack}
    # NOTE: persisting /var/lib/rabbitmq via a named volume hit an .erlang.cookie
    # permission error (eacces) on this Docker setup. Left ephemeral for now; queues are
    # re-declared by services on startup. Revisit for prod with a mnesia-subdir mount.
    ports:
      - "${HOST_BIND:-0.0.0.0}:5672:5672"
      - "${HOST_BIND:-0.0.0.0}:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_BIND:-0.0.0.0}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleettrack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleettrack123}
    ports:
      - "${HOST_BIND:-0.0.0.0}:9000:9000"
      - "${HOST_BIND:-0.0.0.0}:9001:9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/ghana-latest.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "${HOST_BIND:-0.0.0.0}:5000:5000"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    restart: unless-stopped

  # ── Eureka Server ──────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ../backend/eureka-server_1
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:8761:8761"
    environment:
      # JAVA_TOOL_OPTIONS is read automatically by the JVM from the environment (unlike
      # the old JAVA_OPTS here, which the Dockerfile's exec-form ENTRYPOINT never actually
      # expanded — it was silently a no-op). TieredStopAtLevel=1 skips the C2 JIT tier,
      # cutting cold-start time significantly at a negligible cost to steady-state
      # throughput, which suits these low-traffic, frequently-restarted dev containers.
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:TieredStopAtLevel=1"
    depends_on:
      postgres:
        condition: service_healthy
    # NOTE: eureka-server_1 has no spring-boot-starter-actuator dependency (so no
    # /actuator/health), and its runtime image (eclipse-temurin:17-jre-alpine) has no
    # curl. Alpine's busybox does ship wget, and Eureka's default (unsecured) dashboard
    # at "/" returns 200 once the server is actually serving requests, so that's the
    # cheapest reliable readiness signal without touching eureka-server_1 itself.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    restart: unless-stopped

  # ── Auth Service ───────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service_1/Dockerfile
    # SECURITY: internal-only. Reached exclusively through the API gateway over the
    # compose network — NOT published to the host, so clients can't bypass the
    # gateway (and its JWT check) to hit the service directly.
    expose:
      - "8081"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-to-a-long-random-string-before-prod}
      # Creates the first SUPER_ADMIN account on boot if none exists yet — unset/blank in
      # local dev (default) disables it entirely; set both in the server .env for prod.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-fleettrack}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleettrack}
      # Gmail SMTP — blank in local dev (default) silently disables sending (EmailService
      # logs a warning and skips); set both in the server .env to actually deliver mail.
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Base URL for the forgot-password email's link — must be the real deployed admin
      # portal URL in prod (localhost is only correct for local dev).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # See eureka-server's comment: JAVA_TOOL_OPTIONS (not JAVA_OPTS) is what the JVM
      # actually reads from the environment.
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      # Faster registration + faster discovery: defaults (~40s initial replication, 30s
      # registry fetch/lease renewal) make a freshly-booted service invisible to the
      # gateway/other services for tens of seconds after it's actually ready. Shrinking
      # these closes that gap — this is pure timing, it changes no application behavior.
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  # ── API Gateway ────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ../backend/api-gateway_1
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:8080:8080"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-to-a-long-random-string-before-prod}
      # Browser origins allowed to call the API. Prod: set to the deployed admin URL.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:TieredStopAtLevel=1"
      # The gateway discovers EVERY other service via lb://<name> — its own registry-fetch
      # interval is the single biggest lever for "a service just started but the gateway
      # still 503s/404s it." Default 30s; shrunk so newly-up services route within ~5s.
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    restart: unless-stopped

  # ── TLS reverse proxy ──────────────────────────────────────────────────
  # Terminates HTTPS and forwards to the gateway over the internal network.
  # Run infrastructure_1/tls/generate-cert.sh once to create the dev cert.
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  # ── Business Services ──────────────────────────────────────────────────

  driver-service:
    build:
      context: ../backend/driver-service_1
      dockerfile: Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  vehicle-service:
    build:
      context: ../backend/vehicle-service_1
      dockerfile: Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8083"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  trip-service:
    build:
      context: ../backend
      dockerfile: trip-service_2/Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-fleettrack}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleettrack}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      # trip-service's EtaService calls OSRM for route/ETA calculations. The application.yml
      # default (localhost:5000) only works when both processes run on the same host outside
      # Docker — in Compose, "localhost" inside the trip-service container is the container
      # itself, not the separate "osrm" container, so this MUST be set or OSRM calls silently
      # fail with connection-refused (driver navigation + admin live route ETAs break).
      OSRM_BASE_URL: http://osrm:5000
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      osrm:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  gps-service:
    build:
      context: ../backend
      dockerfile: gps-service_2/Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8085"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-fleettrack}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleettrack}
      # Origins allowed on the live-tracking STOMP websocket — must include the deployed
      # admin URL in prod, or the admin live map's socket handshake is rejected.
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  incident-service:
    build:
      context: ../backend
      dockerfile: incident-service_3/Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8087"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-fleettrack}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleettrack}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  media-service:
    build:
      context: ../backend/media-service_3
      dockerfile: Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8086"
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-fleettrack-internal-dev-secret}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      MINIO_ENDPOINT: http://minio:9000
      # MUST be the dev machine's LAN IP (the value the phone uses for the API), NOT
      # localhost — the presigned upload URL is opened by the phone, not the server.
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://172.20.10.4:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-fleettrack}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fleettrack123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped

  audit-service:
    build:
      context: ../backend
      dockerfile: audit-service/Dockerfile
    # SECURITY: internal-only — reachable via the gateway, not published to the host.
    expose:
      - "8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettrack
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleettrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-fleettrack}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-fleettrack}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m -XX:TieredStopAtLevel=1"
      EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
      EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS: "10"
      EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
      EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
