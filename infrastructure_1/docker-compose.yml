# all 12 backend modules + Postgres/RabbitMQ/Redis/MinIO
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleettrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleettrack}
      POSTGRES_DB: ${POSTGRES_DB:-fleettrack}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/ghana-latest.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres-data:
