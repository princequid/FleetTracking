name: Test and Build

# Previously this file was a single comment line, in a directory named
# `.github_5` that GitHub Actions does not read — so nothing was ever validated
# before merge.

on:
  pull_request:
  push:
    branches: [main, firebase-clean]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref — a new push makes the old one moot.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway_1
          - auth-service_1
          - driver-service_1
          - vehicle-service_1
          - trip-service_2
          - gps-service_2
          - incident-service_3
          - media-service_3
          - notification-service_5
          - audit-service
          - eureka-server_1
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Every service depends on shared-events, which is not published to a
      # registry — it must be installed locally before any module will resolve.
      - name: Install shared-events
        run: mvn -B -q -f backend/shared-events_5/pom.xml install -DskipTests

      # `verify`, not `package -DskipTests`: once tests exist this must fail the
      # build. Right now there are none, so this validates compilation only —
      # which is still strictly more than was happening before.
      - name: Build and test
        run: mvn -B -f backend/${{ matrix.service }}/pom.xml verify

  admin-portal:
    name: Admin portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-portal_4/package-lock.json

      - name: Install
        run: npm ci
        working-directory: admin-portal_4

      - name: Build
        run: npm run build
        working-directory: admin-portal_4

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory for now — the mobile tree currently carries known-high advisories
    # that need a coordinated Expo SDK bump. Flip to a hard gate once that lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit · admin portal
        run: npm audit --audit-level=high
        working-directory: admin-portal_4

      - name: npm audit · mobile
        run: npm audit --audit-level=high
        working-directory: mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A live Google Maps key and an unexplained credential-shaped token were
      # both committed to this repo. This job exists so that cannot recur silently.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
